services:
  apidados:
    build:
      context: ./APIdados
      dockerfile: Dockerfile
    container_name: dnd-apidados
    restart: always
    ports:
      - "8081:8081"
    networks:
      dnd-net:
        aliases:
          - apidados-service

  dndmanager:
    build:
      context: ./dndmanager
      dockerfile: Dockerfile
    container_name: dnd-manager
    restart: always
    depends_on:
      - apidados
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/dndmanager}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRATION: "${JWT_EXPIRATION:-24}"
      APIDADO_URL: http://apidados-service:8081
    networks:
      dnd-net:
        aliases:
          - dndmanager-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dnd-frontend
    restart: always
    depends_on:
      - dndmanager
      - apidados
    ports:
      - "3000:80"
    networks:
      - dnd-net

networks:
  dnd-net:
    driver: bridge

